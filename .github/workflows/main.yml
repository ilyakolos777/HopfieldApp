name: Hopfield CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install system dependencies (Qt / OpenGL / EGL)
      run: |
        sudo apt-get update
        sudo apt-get install -y libegl1 libgl1-mesa-dev libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 xvfb

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install numpy PyQt6 pyqtgraph

    - name: Syntax check, module import & Hopfield recall test
      env:
        QT_QPA_PLATFORM: offscreen
      run: |
        xvfb-run python -c "import patterns, hopfield, ui, main; p = patterns.get_bipolar_patterns(); net = hopfield.HopfieldNetwork(); net.fit(p); res = net.recall(p['К']); assert res.matched_label == 'К'"
